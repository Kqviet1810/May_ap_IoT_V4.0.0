name: Build & release firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bisect:
        description: 'Bisect build (control-heartbeat trip): none | A (skip esp_mqtt_client_start) | B (MQTT connect delayed 60 s, unpinned)'
        required: false
        default: 'none'

permissions:
  contents: write

env:
  MAYAP_FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled
  ARDUINO_CLI_VERSION: '1.5.1'
  ARDUINO_CLI_SHA256: '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b'
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Chuan hoa Node.js cho cong cu kiem tra
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned account dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir cloudflare install --frozen-lockfile --ignore-scripts
          node --check account.js
          node --check cloudflare/src/account-worker.js

      - name: Cai Arduino CLI co kiem checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" "$url"
          echo "${ARDUINO_CLI_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" arduino-cli
          sudo install -m 0755 arduino-cli /usr/local/bin/arduino-cli
          arduino-cli version

      - name: Cai toolchain ATtiny13A
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Cai loi ESP32
        run: |
          for attempt in 1 2 3; do
            arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done
          for attempt in 1 2 3; do
            arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Cai thu vien
        run: |
          for attempt in 1 2 3; do
            arduino-cli lib install U8g2@2.36.19 ArduinoJson@7.4.3 && break
            test "$attempt" = 3 && exit 1
            sleep 5
          done

      - name: Kiem tra version va ma nguon an toan
        run: |
          VERSION=$(sed -n 's/.*MAYAP_FIRMWARE_VERSION\[\].*"\([^"]*\)".*/\1/p' MAYAP_INDUSTRIAL_v1_0_0/config.h)
          test -n "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME khong khop firmware $VERSION"
            exit 1
          fi
          if grep -R "setInsecure()" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::Khong duoc bo qua xac thuc TLS"
            exit 1
          fi
          if grep -R "BEGIN.*PRIVATE KEY" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::Private key khong duoc nam trong firmware"
            exit 1
          fi

      - name: Kiem tra hop dong protocol ESP32 ATtiny
        run: python3 tools/check_attiny_protocol.py

      - name: Kiem tra dong bo release
        run: python3 tools/check_release_sync.py

      - name: Kiem tra reliability truoc build/release
        run: python3 tools/check_reliability.py

      - name: Protocol V2 transaction and packet regression
        run: node --test tests/*.test.cjs

      - name: Install pinned Chromium for browser regressions
        working-directory: cloudflare
        run: npx pnpm@11.19.0 exec playwright install --with-deps chromium

      - name: Browser UX regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mayap-qa-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid"' EXIT
          node tools/test_web_experience.cjs /tmp/mayap-web-qa


      - name: Actual PID and autotune host tests
        run: python3 tools/test_thermal_control.py --sanitize

      - name: Adaptive staged boot policy host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/boot-policy.cpp -o /tmp/mayap-boot-test
          /tmp/mayap-boot-test

      - name: Runtime recovery fault injection
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/runtime-recovery.cpp -o /tmp/mayap-runtime-test
          /tmp/mayap-runtime-test
          python3 tools/test_runtime_buses.py --sanitize --check-regression
          python3 tools/test_single_eeprom.py --sanitize

      - name: Nap OTA credential vao diem cau hinh duy nhat
        env:
          MAYAP_OTA_PASSWORD: ${{ secrets.MAYAP_OTA_PASSWORD }}
        run: |
          python3 - <<'PYOTA'
          import json, os
          from pathlib import Path
          release = os.getenv("GITHUB_REF", "").startswith("refs/tags/") or os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"
          password = os.getenv("MAYAP_OTA_PASSWORD", "") if release else "__ci_ota_password__"
          path = Path("MAYAP_INDUSTRIAL_v1_0_0/build_public.h")
          text = path.read_text(encoding="utf-8")
          needle = '#define MAYAP_OTA_PASSWORD ""'
          if text.count(needle) != 1:
              raise SystemExit("MAYAP_OTA_PASSWORD must have exactly one empty tracked definition")
          replacement = "#define MAYAP_OTA_PASSWORD " + json.dumps(password)
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PYOTA

      - name: Kiem tra JavaScript
        run: |
          node --check app.js
          node --check protocol_v2.js
          node --check push.js
          node --check sw.js
          node --check config.js
          node --check cloudflare/src/reliability-wrapper.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js

      - name: Bien dich ATtiny13A
        run: |
          mkdir -p build-attiny
          avr-g++ -x c++ \
            -mmcu=attiny13a \
            -DF_CPU=1200000UL \
            -Os -flto -std=gnu++11 \
            -ffunction-sections -fdata-sections \
            -fno-exceptions -fno-rtti \
            -Wall -Wextra \
            -Wl,--gc-sections \
            ATTINY13A_POWER_ALARM/ATTINY13A_POWER_ALARM.ino \
            -o build-attiny/ATTINY13A_POWER_ALARM.elf

          avr-size -C --mcu=attiny13a build-attiny/ATTINY13A_POWER_ALARM.elf
          read TEXT DATA BSS <<< "$(avr-size build-attiny/ATTINY13A_POWER_ALARM.elf | tail -n 1 | awk '{print $1, $2, $3}')"
          FLASH=$((TEXT + DATA))
          RAM=$((DATA + BSS))
          echo "ATtiny flash=${FLASH}/1024 bytes, static RAM=${RAM}/64 bytes"
          test "$FLASH" -le 1024 || { echo "::error::ATtiny flash vuot 1KB"; exit 1; }
          test "$RAM" -le 64 || { echo "::error::ATtiny static RAM vuot 64B"; exit 1; }

          avr-objcopy -O ihex -R .eeprom \
            build-attiny/ATTINY13A_POWER_ALARM.elf \
            build-attiny/ATTINY13A_POWER_ALARM.hex

      - name: Chon build profile
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "MAYAP_BUILD_PROFILE=PROD" >> "$GITHUB_ENV"
            echo "MAYAP_CPP_FLAGS=-DMAYAP_DIAGNOSTIC_SERIAL=0 -DMAYAP_SERIAL_INPUT_SIM=0" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "MAYAP_BUILD_PROFILE=PILOT" >> "$GITHUB_ENV"
            echo "MAYAP_CPP_FLAGS=-DMAYAP_DIAGNOSTIC_SERIAL=1 -DMAYAP_SERIAL_INPUT_SIM=0" >> "$GITHUB_ENV"
          else
            echo "MAYAP_BUILD_PROFILE=DEV" >> "$GITHUB_ENV"
            echo "MAYAP_CPP_FLAGS=-DMAYAP_DIAGNOSTIC_SERIAL=1 -DMAYAP_SERIAL_INPUT_SIM=0" >> "$GITHUB_ENV"
          fi
          # Manual bisect builds only; watchdog/heartbeat/safety are unchanged.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != refs/tags/* ]]; then
            case "${{ inputs.bisect }}" in
              A) echo "MAYAP_BUILD_PROFILE=PILOT-BISECT-A" >> "$GITHUB_ENV"
                 echo "MAYAP_CPP_FLAGS=-DMAYAP_DIAGNOSTIC_SERIAL=1 -DMAYAP_SERIAL_INPUT_SIM=0 -DMAYAP_BISECT_MQTT_NO_START=1" >> "$GITHUB_ENV" ;;
              B) echo "MAYAP_BUILD_PROFILE=PILOT-BISECT-B" >> "$GITHUB_ENV"
                 echo "MAYAP_CPP_FLAGS=-DMAYAP_DIAGNOSTIC_SERIAL=1 -DMAYAP_SERIAL_INPUT_SIM=0 -DMAYAP_BISECT_MQTT_DELAY_MS=60000" >> "$GITHUB_ENV" ;;
            esac
          fi

      - name: Bien dich firmware ESP32
        shell: bash
        run: |
          set -o pipefail
          echo "Build profile: ${MAYAP_BUILD_PROFILE}"
          arduino-cli compile \
            --fqbn "${{ env.MAYAP_FQBN }}" \
            --build-property "compiler.cpp.extra_flags=${MAYAP_CPP_FLAGS} -DMAYAP_BUILD_REVISION=${GITHUB_SHA:0:12}" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--wrap=xTaskCreate -Wl,--trace-symbol=__wrap_xTaskCreate -Wl,--trace-symbol=xTaskCreate -Wl,--trace-symbol=xTaskCreatePinnedToCore" \
            --output-dir ./build \
            --verbose \
            MAYAP_INDUSTRIAL_v1_0_0 2>&1 | tee /tmp/mayap-compile.log

      - name: Verify esp-mqtt task is created pinned to core 0
        shell: bash
        run: |
          set -euo pipefail
          SDKCONFIG=$(find "$HOME/.arduino15/packages/esp32/tools" -path '*esp32s3-libs/*/sdkconfig' -print -quit)
          echo "sdkconfig: ${SDKCONFIG:-not found}"
          [ -z "$SDKCONFIG" ] || grep -E "MQTT_TASK_CORE_SELECTION|MQTT_USE_CUSTOM_CONFIG" "$SDKCONFIG" || true
          # Linker trace (symbol-level, independent of Xtensa call encodings): who references what.
          echo "--- link references (esp-mqtt) ---"
          grep -E "(mqtt|MQTT).*reference to (__wrap_xTaskCreate|xTaskCreate|xTaskCreatePinnedToCore)" /tmp/mayap-compile.log | sed 's/^[0-9TZ:.-]* //' | sort -u || true
          echo "--- link references (all objects) to xTaskCreate family ---"
          grep -E "reference to (__wrap_xTaskCreate|xTaskCreate|xTaskCreatePinnedToCore)$" /tmp/mayap-compile.log | sed 's/^.*\///' | sort | uniq -c | sort -rn | head -40 || true
          grep -E "mqtt.*reference to __wrap_xTaskCreate" /tmp/mayap-compile.log > /dev/null || { echo "::error::esp-mqtt does not reference __wrap_xTaskCreate (the pin would not apply; it may call xTaskCreatePinnedToCore directly)"; exit 1; }
          nm build/MAYAP_INDUSTRIAL_v1_0_0.ino.elf 2>/dev/null | grep -E " (__wrap_xTaskCreate|__real_xTaskCreate|xTaskCreate)$" || true
          echo "OK: esp-mqtt creates mqtt_task via __wrap_xTaskCreate -> xTaskCreatePinnedToCore(core 0)"

      - name: Enforce V4 network-phase firmware size budgets
        shell: bash
        run: |
          # Phase 1 (no transport) measured Flash=1359805 / static RAM=142184.
          # Full esp-mqtt/WSS path (host is tracked, password comes from NVS at runtime,
          # so nothing is dead-stripped) measured on main: Flash=1439981 / static RAM=161024.
          # Ceilings = measured + ~1.4% Flash / ~1.8% RAM margin; lower them
          # after the stack high-water mark is measured on hardware.
          FLASH=$(sed -n 's/.*Sketch uses \([0-9][0-9]*\) bytes.*/\1/p' /tmp/mayap-compile.log | tail -n 1)
          STATIC_RAM=$(sed -n 's/.*Global variables use \([0-9][0-9]*\) bytes.*/\1/p' /tmp/mayap-compile.log | tail -n 1)
          test -n "$FLASH" || { echo "::error::Cannot read ESP32 Flash size"; exit 1; }
          test -n "$STATIC_RAM" || { echo "::error::Cannot read ESP32 static RAM size"; exit 1; }
          echo "V4 network phase: Flash=${FLASH}/1460000 bytes; static RAM=${STATIC_RAM}/164000 bytes"
          test "$FLASH" -le 1460000 || { echo "::error::ESP32 Flash exceeds V4 budget: ${FLASH} > 1460000"; exit 1; }
          test "$STATIC_RAM" -le 164000 || { echo "::error::ESP32 static RAM exceeds V4 budget: ${STATIC_RAM} > 164000"; exit 1; }

      - name: Verify linked GPIO ISR cache safety
        shell: bash
        run: |
          OBJDUMP=$(find "$HOME/.arduino15/packages/esp32/tools/esp-x32" -type f -name 'xtensa-esp32s3-elf-objdump' -print -quit)
          test -n "$OBJDUMP"
          python3 tools/check_bus_iram.py --objdump "$OBJDUMP" --elf build/MAYAP_INDUSTRIAL_v1_0_0.ino.elf

      - name: Bao cao kich thuoc
        run: |
          ls -la ./build/*.bin
          ls -la ./build-attiny/*.hex

      - name: Luu firmware test
        if: (github.event_name == 'workflow_dispatch' && inputs.bisect != 'A' && inputs.bisect != 'B') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v6
        with:
          name: firmware-test-${{ github.sha }}
          path: |
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.bin
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.merged.bin
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.elf
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.map
            ./build-attiny/ATTINY13A_POWER_ALARM.hex
          retention-days: 7

      - name: Luu firmware bisect A/B
        if: github.event_name == 'workflow_dispatch' && (inputs.bisect == 'A' || inputs.bisect == 'B')
        uses: actions/upload-artifact@v6
        with:
          name: firmware-bisect${{ inputs.bisect }}-${{ github.sha }}
          path: |
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.bin
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.merged.bin
            ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.elf
          retention-days: 7

      - name: Doi ten file .bin theo tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.bin "./MAYAP-firmware-${VERSION}.bin"
          cp ./build/MAYAP_INDUSTRIAL_v1_0_0.ino.elf "./MAYAP-firmware-${VERSION}.elf"
          cp ./build-attiny/ATTINY13A_POWER_ALARM.hex "./MAYAP-ATtiny13A-LINKFIX-${VERSION}.hex"

      - name: Ky so firmware
        if: startsWith(github.ref, 'refs/tags/')
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.MAYAP_OTA_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$OTA_SIGNING_PRIVATE_KEY" || { echo "::error::Thieu khoa ky OTA"; exit 1; }
          printf '%s\n' "$OTA_SIGNING_PRIVATE_KEY" > ota-signing-key.pem
          openssl dgst -sha256 -sign ota-signing-key.pem -out firmware.sig.der "./MAYAP-firmware-${GITHUB_REF_NAME#v}.bin"
          base64 -w0 firmware.sig.der > "./MAYAP-firmware-${GITHUB_REF_NAME#v}.sig"
          rm -f ota-signing-key.pem firmware.sig.der

      - name: Tao GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./MAYAP-firmware-*.bin
            ./MAYAP-firmware-*.sig
            ./MAYAP-firmware-*.elf
            ./MAYAP-ATtiny13A-LINKFIX-*.hex
          generate_release_notes: true
