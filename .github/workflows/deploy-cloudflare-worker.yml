name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: ["Build & release firmware"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Nhanh/tag chua ma Worker can deploy'
        required: true
        default: 'main'

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.CLOUDFLARE_AUTODEPLOY == '1' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ma nguon can deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_ref }}
          fetch-depth: 0
      - name: Cai Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Kiem tra secret trien khai
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Thieu CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Thieu CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Kiem tra JavaScript Worker
        run: |
          node --check cloudflare/src/reliability-wrapper.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/index.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js
          node --check config.js

      - name: Kiem tra dong bo release
        run: python3 tools/check_release_sync.py

      - name: Kiem tra reliability truoc deploy
        run: python3 tools/check_reliability.py

      - name: Cai phu thuoc Worker
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes pnpm@11.19.0 install --frozen-lockfile
          node --check src/account-worker.js

      - name: Account and transaction regression
        run: |
          node --test tests/*.test.cjs
          python3 tools/test_single_eeprom.py --sanitize --check-regression

      - name: Stage reviewed public assets only
        run: python3 tools/build_web_assets.py

      - name: Cap nhat D1 schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mayap_push --remote

      - name: Trien khai Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Trien khai broker MQTT (mayap-mqtt-broker)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-broker.toml

      - name: Dong bo secret MQTT (neu da khai bao trong GitHub secrets)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MQTT_WEB_TOKEN_SECRET: ${{ secrets.MQTT_WEB_TOKEN_SECRET }}
          MQTT_DEVICE_SECRET: ${{ secrets.MQTT_DEVICE_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$MQTT_WEB_TOKEN_SECRET" ]; then
            printf '%s' "$MQTT_WEB_TOKEN_SECRET" | npx wrangler secret put BROKER_WEB_TOKEN_SECRET -c wrangler-broker.toml
            printf '%s' "$MQTT_WEB_TOKEN_SECRET" | npx wrangler secret put MQTT_WEB_TOKEN_SECRET
          else
            echo "::warning::Chua co GitHub secret MQTT_WEB_TOKEN_SECRET - dat bang wrangler secret put (xem doc/MVP_BRINGUP.md)"
          fi
          # Mat khau MQTT rieng tung may = HMAC(MQTT_DEVICE_SECRET, device id). Worker
          # tra cho may qua /api/device/register, broker tinh lai de kiem.
          if [ -n "$MQTT_DEVICE_SECRET" ]; then
            printf '%s' "$MQTT_DEVICE_SECRET" | npx wrangler secret put BROKER_DEVICE_SECRET -c wrangler-broker.toml
            printf '%s' "$MQTT_DEVICE_SECRET" | npx wrangler secret put MQTT_DEVICE_SECRET
          else
            echo "::warning::Chua co GitHub secret MQTT_DEVICE_SECRET - may se khong nhan duoc mat khau MQTT"
          fi
