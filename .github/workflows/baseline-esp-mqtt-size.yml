name: Baseline esp-mqtt size (temporary, one-off)

# One-off measurement for PR #7: rebuild the historical esp-mqtt/WSS commit (main before the
# native MQTT/TLS change) with the same Arduino core / FQBN / diagnostic flags, once with OTA OFF
# and once with OTA ON, so the Flash/RAM comparison is like-for-like. Removed after the run.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/baseline-esp-mqtt-size.yml'

permissions:
  contents: read

env:
  BASELINE_SHA: f59f0138021ed0f4f8a94ab2a1f28f6442038dfc
  MAYAP_FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M,PSRAM=disabled
  ARDUINO_CLI_VERSION: '1.5.1'
  ARDUINO_CLI_SHA256: '28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b'
  MAYAP_CPP_FLAGS: -DMAYAP_DIAGNOSTIC_SERIAL=1 -DMAYAP_SERIAL_INPUT_SIM=0

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historical esp-mqtt/WSS commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 1

      - name: Cai Arduino CLI co kiem checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o "$archive" "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"
          echo "${ARDUINO_CLI_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" arduino-cli
          sudo install -m 0755 arduino-cli /usr/local/bin/arduino-cli

      - name: Cai loi ESP32 va thu vien
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          for attempt in 1 2 3; do arduino-cli core update-index --additional-urls "$URL" && break; test "$attempt" = 3 && exit 1; sleep 5; done
          for attempt in 1 2 3; do arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$URL" && break; test "$attempt" = 3 && exit 1; sleep 5; done
          for attempt in 1 2 3; do arduino-cli lib install U8g2@2.36.19 ArduinoJson@7.4.3 && break; test "$attempt" = 3 && exit 1; sleep 5; done

      - name: Build historical esp-mqtt/WSS with OTA OFF then ON and report sizes
        shell: bash
        run: |
          set -uo pipefail
          HDR=MAYAP_INDUSTRIAL_v1_0_0/build_public.h
          grep -q '^#define MAYAP_OTA_PASSWORD ""' "$HDR" || { echo "::error::unexpected OTA definition at baseline"; exit 1; }
          cp "$HDR" /tmp/build_public.h.orig
          NM=$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name 'xtensa-esp32s3-elf-nm' -print -quit)
          build() {  # $1 label, $2 output dir
            arduino-cli compile --fqbn "$MAYAP_FQBN" \
              --build-property "compiler.cpp.extra_flags=${MAYAP_CPP_FLAGS} -DMAYAP_BUILD_REVISION=${BASELINE_SHA:0:12}" \
              --output-dir "$2" --verbose MAYAP_INDUSTRIAL_v1_0_0 > "/tmp/$1.log" 2>&1 || { tail -n 40 "/tmp/$1.log"; exit 1; }
            ELF=$(ls "$2"/*.elf | head -n 1); MAP=$(ls "$2"/*.map | head -n 1)
            echo "== esp-mqtt/WSS @ ${BASE_SHORT:-f59f0138} [$1]: $(grep -E 'Sketch uses|Global variables use' /tmp/$1.log | tr '\n' ' ')"
            echo "   ArduinoOTAClass symbols: $("$NM" -C "$ELF" | grep -c 'ArduinoOTAClass::' || true); libmqtt members linked: $(grep -cE 'libmqtt\.a\(' "$MAP" || true)"
          }
          build ota_off ./build-off
          sed -i 's|^#define MAYAP_OTA_PASSWORD ""|#define MAYAP_OTA_PASSWORD "__ci_ota_password__"|' "$HDR"
          build ota_on ./build-on
          cp /tmp/build_public.h.orig "$HDR"
