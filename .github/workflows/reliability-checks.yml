name: Reliability regression checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned account dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir cloudflare install --frozen-lockfile --ignore-scripts
          node --check account.js
          node --check cloudflare/src/account-worker.js

      - name: Validate JavaScript entrypoints
        run: |
          node --check cloudflare/src/index.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/reliability-wrapper.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js
          node --check app.js
          node --check notes.js
          node --check protocol_v2.js
          node --check config.js
          node --check push.js
          node --check sw.js

      - name: Release synchronization checks
        run: python3 tools/check_release_sync.py

      - name: ATtiny LINKFIX protocol checks
        run: python3 tools/check_attiny_protocol.py

      - name: Static reliability regression checks
        run: python3 tools/check_reliability.py

      - name: Protocol V2 transaction and packet regression
        run: node --test tests/*.test.cjs

      - name: Install pinned Chromium for browser regressions
        working-directory: cloudflare
        run: npx pnpm@11.19.0 exec playwright install --with-deps chromium

      - name: Browser UX regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mayap-qa-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid"' EXIT
          run_browser_qa() {
            local qa_log="/tmp/$(basename "$1").log"
            if node "$1" "$2" > "$qa_log" 2>&1; then
              cat "$qa_log"
            else
              cat "$qa_log"
              python3 - "$qa_log" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()[-6000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser regression failure::' + text)
          PY
              return 1
            fi
          }
          run_browser_qa tools/test_web_experience.cjs /tmp/mayap-web-qa

      - name: AT24C512 driver regression
        run: python3 tools/test_single_eeprom.py --sanitize --check-regression


      - name: Actual PID and autotune host tests
        run: python3 tools/test_thermal_control.py --sanitize --report-dir /tmp/mayap-thermal-report

      - name: Adaptive Thermal V1 simulation gates (simulation only, physical validation required)
        run: python3 tools/test_thermal_adaptive.py --report-dir /tmp/mayap-thermal-adaptive-report

      - name: Smart AutoTune V1 simulation gates (simulation only, physical commissioning required)
        run: python3 tools/test_smart_autotune.py --report-dir /tmp/mayap-smart-autotune-report

      - name: Thermal control-only metrics and safety threshold qualification (physical performance unverified)
        uses: actions/upload-artifact@v4
        with:
          name: thermal-old-new-metrics
          path: |
            /tmp/mayap-thermal-report
            /tmp/mayap-thermal-adaptive-report/summary.md
            /tmp/mayap-smart-autotune-report/summary.md

      - name: Adaptive staged boot policy host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/boot-policy.cpp -o /tmp/mayap-boot-test
          /tmp/mayap-boot-test

      - name: ArduinoJson headers for actual bootstrap serializer host test
        uses: actions/checkout@v7
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: .qa-libs/ArduinoJson
          persist-credentials: false

      - name: Runtime recovery fault injection
        env:
          MAYAP_ARDUINOJSON: ${{ github.workspace }}/.qa-libs/ArduinoJson/src
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/runtime-recovery.cpp -o /tmp/mayap-runtime-test
          /tmp/mayap-runtime-test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/turn-schedule.cpp -o /tmp/mayap-turn-schedule-test
          /tmp/mayap-turn-schedule-test
          python3 tools/test_turning_scheduler.py --sanitize --check-regression
          python3 tools/test_wifi_state.py --sanitize --check-regression
          python3 tools/test_runtime_buses.py --sanitize

      - name: Reject unsafe firmware shortcuts
        run: |
          if grep -R "setInsecure()" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::TLS verification bypass detected"
            exit 1
          fi
          if grep -R "BEGIN.*PRIVATE KEY" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::Private key must not be embedded in firmware"
            exit 1
          fi

      - name: Verify formatting
        run: git diff --check HEAD^ HEAD --
