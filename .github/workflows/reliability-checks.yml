name: Reliability regression checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned account dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir cloudflare install --frozen-lockfile --ignore-scripts
          node --check account.js
          node --check cloudflare/src/account-worker.js

      - name: Validate JavaScript entrypoints
        run: |
          node --check cloudflare/src/index.js
          node --check cloudflare/src/security-wrapper.js
          node --check cloudflare/src/reliability-wrapper.js
          node --check cloudflare/src/auth.js
          node --check cloudflare/src/db.js
          node --check cloudflare/src/push.js
          node --check app.js
          node --check notes.js
          node --check protocol_v2.js
          node --check config.js
          node --check push.js
          node --check sw.js

      - name: Release synchronization checks
        run: python3 tools/check_release_sync.py

      - name: ATtiny LINKFIX protocol checks
        run: python3 tools/check_attiny_protocol.py

      - name: Static reliability regression checks
        run: python3 tools/check_reliability.py

      - name: Protocol V2 transaction and packet regression
        run: node --test tests/*.test.cjs

      - name: Install pinned Chromium for browser regressions
        working-directory: cloudflare
        run: npx pnpm@11.19.0 exec playwright install --with-deps chromium

      - name: Browser UX regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mayap-qa-http.log 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid"' EXIT
          run_browser_qa() {
            local qa_log="/tmp/$(basename "$1").log"
            if node "$1" "$2" > "$qa_log" 2>&1; then
              cat "$qa_log"
            else
              cat "$qa_log"
              python3 - "$qa_log" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()[-6000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Browser regression failure::' + text)
          PY
              return 1
            fi
          }
          run_browser_qa tools/test_web_experience.cjs /tmp/mayap-web-qa

      - name: Firmware MQTT/WSS transport vs the real broker Durable Object (workerd)
        run: node tools/e2e/firmware_wss_interop.cjs /tmp/mayap-fw-wss

      - name: End-to-end Web (Chromium) - real broker Durable Object - device emulator, incl. make-before-break token renewal
        run: node tools/e2e/run_mvp.cjs /tmp/mayap-e2e-mvp

      - name: Keep end-to-end logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-realtime-web-logs
          path: |
            /tmp/mayap-e2e-mvp
            /tmp/mayap-fw-wss
          if-no-files-found: ignore

  uplink:
    name: uplink
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned account dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir cloudflare install --frozen-lockfile --ignore-scripts
          node --check account.js
          node --check cloudflare/src/account-worker.js

      - name: Alarm uplink resilience on the real broker Durable Object (slow/down/throttling Worker, queue overflow, broker restart, 20 devices)
        run: node tools/e2e/uplink_resilience.cjs /tmp/mayap-e2e-uplink

      - name: Keep end-to-end logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-realtime-alarm-logs
          path: |
            /tmp/mayap-e2e-mvp
            /tmp/mayap-e2e-uplink
            /tmp/mayap-fw-wss
          if-no-files-found: ignore

  heater-path:
    name: heater-path
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: AT24C512 driver regression
        run: python3 tools/test_single_eeprom.py --sanitize --check-regression

      - name: Heater path host tests (GPIO arbiter, SSR burst scheduler, E115 evidence, config serializers, sensor filter, programme). No controller exists in V2.0.0.
        run: python3 tools/test_heater_path.py --sanitize --report-dir /tmp/mayap-heater-path-report

      - name: "Thermal V3 controller host unit tests (Energy-In-Flight, physical discovery, anti-shock, door-open guard, watchdog)"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/thermal-v3.cpp -o /tmp/mayap-thermal-v3-test
          /tmp/mayap-thermal-v3-test

      - name: "Vent line (vent_line.h): the exhaust fans are a last resort - decided on the mean of the reading (not blinded by a flicker between sensor steps), watched for 1.2 transit times while the heater brings it down, started by a stuck / fast / predicted / heater-at-floor reason, run 3-10 min, rest 5 min, paid from a token bucket, never cut the heater"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/vent-line.cpp -o /tmp/mayap-vent-line
          /tmp/mayap-vent-line

      - name: "Alarm sound policy (alarm_sound.h): both over-temperature lines (High, Emergency) sound the siren at once when crossed and go quiet when the reading is 0.2 degC under the line, continuous 5 min then pulsed, ACK mutes while it falls; the Chime class reminds thinly"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/alarm-sound.cpp -o /tmp/mayap-alarm-sound
          /tmp/mayap-alarm-sound

      - name: "Overshoot after a protection cut the heater (thermal_v3.h): the hold level keeps 60 % of itself when the controller's own overshoot was cut, fades while the held-off reading does not fall, and is left alone when it falls"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/thermal-overshoot.cpp -o /tmp/mayap-thermal-overshoot
          /tmp/mayap-thermal-overshoot

      - name: "Thermal learning kept across a restart (thermal_learn.h): checksum and ranges refuse a damaged record, two stable hours before a write, the hold level only for the batch it belongs to, the controller takes it back"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/thermal-learn.cpp -o /tmp/mayap-thermal-learn
          /tmp/mayap-thermal-learn

      - name: "Fleet bench builds (210 random ovens x 10 situations with the real vent line and the restored state)"
        run: g++ -O2 -std=c++17 -Wall -Wextra -Werror tools/thermal-research/fleet-bench.cpp -o /tmp/mayap-fleet-bench

      - name: "E115 evidence (heater_response_watch.h): unit tests of the rule MachineController runs"
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/heater-response-watch.cpp -o /tmp/mayap-heater-response-watch
          /tmp/mayap-heater-response-watch

      - name: "Thermal V3 closed loop: the real controller and the real E115 rule on simulated ovens (first climb also after an idle start, door, cold tray, vent, set-point step, reboot, a day of ordinary operation, dead heater), next to the 2.3.4 pair, and on the oven fitted to the 29/10 batch"
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/thermal-closed-loop.cpp -o /tmp/mayap-thermal-closed-loop
          /tmp/mayap-thermal-closed-loop

      - name: "Thermal replay of the machine's own log of 29/10 (E115 of 2.3.4 trips on it, the rule of 2.4.0 does not; the simulated oven follows the log)"
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/thermal-replay.cpp -o /tmp/mayap-thermal-replay
          /tmp/mayap-thermal-replay

      - name: Technical PIN, Web permission, HMI-approved requests and old records (host tests of the real controller code)
        run: python3 tools/test_tech_access.py --sanitize

  host:
    name: host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Adaptive staged boot policy host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/boot-policy.cpp -o /tmp/mayap-boot-test
          /tmp/mayap-boot-test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/boot-safety.cpp -o /tmp/mayap-boot-safety
          /tmp/mayap-boot-safety

      - name: ArduinoJson headers for actual bootstrap serializer host test
        uses: actions/checkout@v7
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: .qa-libs/ArduinoJson
          persist-credentials: false

      - name: Runtime recovery fault injection
        env:
          MAYAP_ARDUINOJSON: ${{ github.workspace }}/.qa-libs/ArduinoJson/src
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/runtime-recovery.cpp -o /tmp/mayap-runtime-test
          /tmp/mayap-runtime-test
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/turn-schedule.cpp -o /tmp/mayap-turn-schedule-test
          /tmp/mayap-turn-schedule-test
          python3 tools/test_turning_scheduler.py --sanitize --check-regression
          python3 tools/test_wifi_state.py --sanitize --check-regression
          python3 tools/test_runtime_buses.py --sanitize

      - name: Firmware check answer parser (every shape of the /api/firmware/check answer)
        env:
          MAYAP_ARDUINOJSON: ${{ github.workspace }}/.qa-libs/ArduinoJson/src
        run: node --test tests/firmware-check-parse.test.cjs

      - name: Reject unsafe firmware shortcuts
        run: |
          if grep -R "setInsecure()" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::TLS verification bypass detected"
            exit 1
          fi
          if grep -R "BEGIN.*PRIVATE KEY" MAYAP_INDUSTRIAL_v1_0_0 --include='*.h' --include='*.ino'; then
            echo "::error::Private key must not be embedded in firmware"
            exit 1
          fi

      - name: Verify formatting
        run: git diff --check HEAD^ HEAD --

  reliability:
    name: reliability
    if: always()
    needs: [web, uplink, heater-path, host]
    runs-on: ubuntu-24.04
    steps:
      - name: All reliability jobs must be green
        shell: bash
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::at least one reliability job did not succeed"; exit 1
          fi
