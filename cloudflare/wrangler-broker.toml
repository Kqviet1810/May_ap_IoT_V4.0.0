name = "mayap-mqtt-broker"
main = "src/broker/broker-entry.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Credentials are SECRETS, never committed and never declared under [vars] (an
# empty var could shadow a secret):
#   wrangler secret put BROKER_DEVICE_SECRET           -c wrangler-broker.toml   (derives each ESP32's password; same value as Worker MQTT_DEVICE_SECRET)
#   wrangler secret put BROKER_WEB_TOKEN_SECRET        -c wrangler-broker.toml   (verifies Web tokens)
# Without them the broker fails closed (no client can authenticate).
# `wrangler dev` takes them with --var (see tools/e2e/run_mvp.cjs).

# Device alarms/heartbeats published over MQTT (topics alarm, heartbeat): the broker stores them in its own Durable Object queue
# and PUBACKs (BROKER_STORED); from the DO alarm it then signs and forwards them, in batches with retry/backoff, through this
# service binding to the main Worker (D1 + Web Push). The Worker may be slow or down without affecting the device link.
# Deploy the main Worker FIRST: it must expose /api/internal/uplink with the batched `kind:"alarms"` form and per-event verdicts.
[[services]]
binding = "CLOUD_INGEST"
service = "mayap-push-worker"

[[durable_objects.bindings]]
name = "MQTT_BROKER"
class_name = "MqttBrokerDO"

[[migrations]]
tag = "v1-mqtt-broker"
new_sqlite_classes = ["MqttBrokerDO"]
